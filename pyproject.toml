[project]
name = "novel-rewriting"
version = "0.0.1"
description = "把网文原作重构成一本新书的 7 阶段流水线（正式开发）"
requires-python = ">=3.10"
# 产物 schema 的载体（2026-08-10 裁决）。v1 与 v2 的 API 差异极大，下界必须钉死。
# ⚠ 建模时两条默认行为要显式改掉，理由见 README：
#   extra 默认 ignore（未知字段静默丢弃）· 给可选字段配默认值会让「缺字段」与「null」混掉
dependencies = ["pydantic>=2"]

# 依赖分层：**base 只留 pydantic**。契约层的全部测试不该需要网络栈——
# `tests/` 里跑得最多的那批（语料体检 · 分层 · 双向覆盖率）一个 HTTP 请求都不发，
# 而 `contracts/` 的四个消费方里三个不需要运行时。
#
# ⚠ `openai` 只被 `novel/llm/transport.py::DeepSeekTransport` 用到，而且是**懒 import**
#   （在 `_sdk()` 里，不在模块顶层）：没装它照样能跑完整条 0 成本链路，
#   因为那条链路走的是 `FakeTransport`。`tests/test_llm.py` 一次都不 import 它。
#
# ⚠ `api` 那一层同理**只被 `novel/api/app.py` 与 `novel/api/__main__.py` 用到**
#   （白名单在 `tests/test_layering.py::_WEB_STACK_ALLOWED`，逐条写着理由）。
#   `novel/api/enums.py` / `errors.py` 与 `novel/views/**` 都是纯函数，没装 fastapi
#   照样 import 得进来——**E 期的绝大多数测试因此不需要 `importorskip`**，
#   而 `importorskip` 跳过去的东西看起来像绿的。
[project.optional-dependencies]
llm = ["openai>=2"]
api = ["fastapi>=0.110", "uvicorn>=0.30"]
dev = ["pytest>=8", "httpx>=0.27"]

# 骨架 D 加的。**它解的是一个具体的问题，不是形式**：
# `build_argv` 拼出来的那条命令是 `<python> -X utf8 -u -m novel.cli …`，
# 而 `-m novel.cli` 要求 cwd 在仓根（`pythonpath=["."]` 只对 pytest 生效）。
# 装成 editable（`pip install -e .`）之后这条 cwd 依赖就没了，
# 而 `Step.cwd` 仍然如实记着那一次是在哪儿跑的——**记录与依赖是两件事**。
#
# ⚠ **刻意不加 `[project.scripts]`**：那会让 `argv[0]` 变成一个包装脚本，
# 与「`argv[0]` 恒是 `sys.executable`，绝不硬编码解释器路径」直接冲突
# （换一个 venv 就会指到另一份依赖上，而那份 `contracts` 可能是旧的）。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# ⚠ **移植一层要在这里加一行。** 漏掉不会有任何测试出声（`pythonpath=["."]` 让
#   pytest 照样 import 得到），只有**非 editable 安装**才会缺包——而那时人看到的
#   是运行时 `ModuleNotFoundError`，离根因很远。
#   实测漏过一次：F1 把 `novel.stages.stage6` 建出来了而这张表没跟上，F2 补回来。
packages = ["contracts", "contracts.judges", "contracts.schema",
            "novel", "novel.api", "novel.api.routes", "novel.cli", "novel.core",
            "novel.llm", "novel.orchestrator", "novel.report", "novel.stages",
            "novel.stages.stage0", "novel.stages.stage1",
            "novel.stages.stage2", "novel.stages.stage3", "novel.stages.stage4",
            "novel.stages.stage5", "novel.stages.stage6",
            "novel.stages.stage7",
            "novel.views"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = '-q -m "not corpus" --basetemp=.test_runtime'
cache_dir = ".test_cache"
markers = [
    "corpus: optional integration checks against NOVEL_OUTPUT or local source corpora",
]
